<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fafafa;color:#171717;font-family:system-ui,sans-serif}
.bar{padding:16px;display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.bar span:last-child{font-weight:400;color:#737373}
h1{font-size:28px;line-height:1.15;letter-spacing:-.5px;padding:8px 16px 16px;font-weight:600}
.search{padding:0 16px;display:grid;gap:8px}
.field{border:1px solid #e5e5e5;border-radius:10px;padding:12px;font-size:15px;background:#fff;color:#737373}
.go{background:#0f766e;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:500}
.card{margin:12px 16px 0;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;display:flex;gap:12px}
.av{width:48px;height:48px;border-radius:50%;background:#e5e5e5}
.card b{display:block;font-size:15px;font-weight:600}
.card span{font-size:13px;color:#737373}
.chips{margin-top:8px;display:flex;gap:6px}
.chip{font-size:12px;border:1px solid #e5e5e5;border-radius:99px;padding:2px 8px;color:#525252}
</style></head><body>
<div class="bar"><span>Profes La Plata</span><span>Soy profe</span></div>
<h1>Encontrá tu profe particular en La Plata.</h1>
<div class="search"><div class="field">Materia</div><div class="field">Nivel</div><div class="go">Buscar</div></div>
<div class="card"><div class="av"></div><div><b>Ana Pérez</b><span>$18.000/h · Centro · ★ 5,0</span><div class="chips"><span class="chip">Matemática A</span><span class="chip">Análisis I</span></div></div></div>
<div class="card"><div class="av"></div><div><b>Lucas Medina</b><span>$15.000/h · Online · ★ 4,8</span><div class="chips"><span class="chip">Matemática A</span><span class="chip">Física I</span></div></div></div>
<div class="card"><div class="av"></div><div><b>Sofía Ruiz</b><span>$16.000/h · Tolosa</span><div class="chips"><span class="chip">Matemática A</span></div></div></div>
</body></html>
