<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111827;font-family:system-ui,sans-serif}
.bar{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}
.bar b{color:#2563eb;font-size:18px}
.hero{background:#eff6ff;padding:24px 16px}
.hero h1{font-size:26px;line-height:1.2}
.hero p{color:#4b5563;margin:8px 0 14px;font-size:15px}
.field{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:12px;color:#6b7280;margin-bottom:8px}
.go{background:#2563eb;color:#fff;text-align:center;padding:12px;border-radius:8px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.c{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.img{height:110px;background:#d1d5db}
.c div{padding:8px;font-size:13px}
.c b{display:block;font-size:14px}
</style></head><body>
<div class="bar"><b>Profes La Plata</b><span style="font-size:14px">Ingresar</span></div>
<div class="hero"><h1>Encontrá el profe ideal</h1><p>Clases particulares en La Plata</p><div class="field">¿Qué querés aprender?</div><div class="go">Buscar</div></div>
<div class="grid">
<div class="c"><div class="img"></div><div><b>Ana</b>Matemática · $18.000/h ★5</div></div>
<div class="c"><div class="img"></div><div><b>Lucas</b>Física · $15.000/h ★4,8</div></div>
<div class="c"><div class="img"></div><div><b>Sofía</b>Matemática · $16.000/h</div></div>
<div class="c"><div class="img"></div><div><b>Tomás</b>Inglés · $14.000/h</div></div>
</div>
</body></html>
