# Base de datos local para desarrollo (npm run dev).
# La web publicada sigue usando Neon; esto es solo para probar sin tocar datos reales.
#   npm run db:local        -> levanta Postgres en Docker
#   npm run db:setup:local  -> crea las tablas y carga las materias
services:
  db:
    image: postgres:17-alpine
    container_name: tirita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tirita
      POSTGRES_PASSWORD: tirita
      POSTGRES_DB: tirita
    ports:
      # Puerto 55441 solo en tu compu (5432 y 5433 ya los usan otros Postgres).
      - "127.0.0.1:55441:5432"
    volumes:
      - tirita-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirita -d tirita"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tirita-db:
